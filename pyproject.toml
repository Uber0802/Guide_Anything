[project]
name = "guide-anything"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = []  # isaacsim / isaaclab / torch come from the conda env, see README

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["guide_anything*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["E", "I"]

[tool.ruff.lint.per-file-ignores]
# Isaac Sim has to be launched before isaaclab modules are imported.
"scripts/*" = ["E402"]
